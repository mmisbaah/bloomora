name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generated problems are valid
        run: node tests/generator.test.mjs
      - name: Offline file list is complete
        run: node tests/offline.test.mjs
